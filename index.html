function builder(id){let s=id?stories.find(x=>x.id===id):null;return `<section class="pagehead"><div class="wrap"><div class="eyebrow"><i class="dot"></i> COMMUNITY STORY BUILDER</div><h1>${s?'গল্প সম্পাদনা করুন':'আপনার গল্প যোগ করুন।'}</h1><p>কোনো মিম, ট্রেন্ড বা অনলাইন মুহূর্ত মনে আছে? প্রেক্ষাপট, সময়রেখা আর সূত্রসহ লিখে রাখুন।</p></div></section><section class="wrap"><form class="builder" id="storyform"><div class="notice">আপনার লেখা এই ব্রাউজারে সেভ হবে। এটি কোনো সার্ভারে আপলোড হবে না।</div><div class="formgrid"><div class="fg full"><label>গল্পের শিরোনাম *</label><input class="field" name="title" required maxlength="120" value="${esc(s?.title||'')}" placeholder="একটি ভাইরাল মুহূর্তের গল্প"></div><div class="fg"><label>ক্যাটাগরি</label><select class="field" name="category">${cats.map(c=>`<option value="${c.id}" ${s?.category===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="fg"><label>তারিখ / সময়কাল</label><input class="field" name="date" value="${esc(s?.date||'')}" placeholder="যেমন: ২০২৩ সালের শেষ দিকে"></div><div class="fg full"><label>গল্পের সারাংশ *</label><textarea class="field" name="summary" required maxlength="1200">${esc(s?.summary||'')}</textarea><small class="muted">নিশ্চিত নন এমন তথ্যকে সত্য হিসেবে লিখবেন না।</small></div><div class="fg"><label>তথ্যের অবস্থা</label><select class="field" name="status"><option value="source" ${s?.status==='source'?'selected':''}>সূত্র অনুযায়ী</option><option value="verified" ${s?.status==='verified'?'selected':''}>যাচাইকৃত তথ্য</option><option value="uncertain" ${s?.status==='uncertain'?'selected':''}>এখনো নিশ্চিত নয়</option></select></div><div class="fg"><label>কভার রং</label><select class="field" name="cover">${[['yellow','হলুদ'],['red','লাল'],['green','সবুজ'],['blue','নীল']].map(([v,n])=>`<option value="${v}" ${(s?.cover||'yellow')===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="fg full"><label>সময়রেখা (প্রতি লাইনে: সময় | শিরোনাম | বিবরণ)</label><textarea class="field" name="timeline" placeholder="২০২২ | শুরু | প্রথম ঘটনাটি লিখুন">${(s?.timeline||[]).map(t=>t.join(' | ')).join('\n')}</textarea></div><div class="fg full"><label>সূত্রের URL (প্রতি লাইনে একটি)</label><textarea class="field" name="sources" placeholder="https://example.com/source">${(s?.sources||[]).join('\n')}</textarea></div></div><div class="actions"><button class="btn dark" type="submit">${s?'পরিবর্তন সেভ করুন':'গল্প সেভ করুন'} ↗</button><a class="btn" href="#/archive">বাতিল</a></div></form></section>`}
function about(){return `<section class="pagehead"><div class="wrap"><div class="eyebrow"><i class="dot"></i> WHY DESHILENS?</div><h1>আমাদের ইন্টারনেট।<br>আমাদেরই ইতিহাস।</h1><p>বাংলাদেশের অনলাইন সংস্কৃতি, কমিউনিটি, মিম, ভাষা ও স্মৃতি প্রেক্ষাপটসহ সংরক্ষণের একটি স্বাধীন আর্কাইভ ধারণা।</p></div></section><section class="wrap section"><div class="profile"><div class="profilemark">রেহান<br><small style="font-size:13px">DESHILENS</small></div><div><div class="eyebrow">FOUNDER / CURATOR</div><h2>Abdur Rehan</h2><p>দেশি ইন্টারনেট সংস্কৃতি, সৃজনশীলতা আর ডিজিটাল স্মৃতি সংরক্ষণের আগ্রহ থেকে এই আর্কাইভের ধারণা।</p><blockquote>“মিম থেকে মাইলফলক—বাংলাদেশের ইন্টারনেট, নিজের গল্পে।”</blockquote><div class="clockline"><span id="aboutBnDate">বাংলা তারিখ</span><span id="aboutBdTime">বাংলাদেশ সময়</span></div></div></div><div class="grid" style="margin-top:26px">${[['01 / PURPOSE','কেন এই আর্কাইভ?','অনলাইনের গল্প দ্রুত হারিয়ে যায়। এগুলোকে সময়, প্রেক্ষাপট ও উৎসসহ ধরে রাখাই লক্ষ্য।'],['02 / EVIDENCE','তথ্য আর অনুমান আলাদা','যাচাইকৃত তথ্য, সূত্র অনুযায়ী বর্ণনা এবং অনিশ্চিত দাবি আলাদা করে দেখানো উচিত।'],['03 / COMMUNITY','গল্প সবার','নিজেদের স্মৃতি যোগ করুন। প্রকাশের আগে নির্ভরযোগ্য সূত্র যাচাই করা জরুরি।']].map(x=>`<article class="card"><div class="body"><small>${x[0]}</small><h3>${x[1]}</h3><p>${x[2]}</p></div></article>`).join('')}</div><h2>সম্পাদকীয় নীতি</h2><ul><li>সম্ভব হলে প্রাথমিক বা নির্ভরযোগ্য সূত্র যুক্ত করুন।</li><li>যাচাইহীন অভিযোগকে সত্য হিসেবে উপস্থাপন করবেন না।</li><li>তারিখ বা প্রেক্ষাপট নিশ্চিত না হলে তা স্পষ্টভাবে লিখুন।</li><li>ডেমো এন্ট্রি সম্পূর্ণ গবেষণার বিকল্প নয়; বর্তমান ট্রেন্ডগুলো প্রকাশিত সংবাদ-প্রতিবেদনের ভিত্তিতে কিউরেট করা।</li><li>কারও পোস্ট বা ছবি অনুমতি ছাড়া পুনঃপ্রকাশ না করে মূল প্রতিবেদন/পোস্টে লিংক দিন। এই প্যাকেজের SVG artwork নিজস্ব সম্পাদকীয় চিত্র, মূল মিমের স্ক্রিনশট নয়।</li><li>আপনার গল্প শুধু বর্তমান ব্রাউজারে সেভ হয়।</li></ul><a class="btn" href="#/builder">একটি গল্প লিখুন ＋</a></section>`}

{title:'ঢাকার চলমান ক্যানভাস',category:'rickshaw',src:'assets/khela-hobe.svg',caption:'শহরের গতি আর হাতে আঁকা সাইনবোর্ডের ভিজ্যুয়াল ভাষা থেকে অনুপ্রাণিত।'},

{title:'পোস্টার-রঙের বাংলাদেশ',category:'folk',src:'assets/july-memes.svg',caption:'পোস্টার, দেয়াললিখন ও নাগরিক ভিজ্যুয়াল সংস্কৃতির প্রতি শ্রদ্ধা।'},
{title:'পুরোনো নেটের স্মৃতি',category:'digital',src:'assets/retro-ai.svg',caption:'রেট্রো ডিজিটাল নান্দনিকতা ও স্মৃতির কোলাজ।'},
{title:'পথের গল্প',category:'rickshaw',src:'assets/unseen-bangladesh.svg',caption:'পথ, মানুষ ও বাংলাদেশের জায়গাগুলোকে ঘিরে ভিজ্যুয়াল গল্প।'},
{title:'নতুন প্রজন্মের ভাষা',category:'digital',src:'assets/baper-rasta.svg',caption:'মিম, গেম আর অনলাইন কথ্যভাষার প্রাণচাঞ্চল্য।'}];
function galleryTile(g,i){return `<button class="gallerytile" onclick="openGallery(${i})" aria-label="${esc(g.title)} দেখুন"><img src="${esc(g.src)}" loading="lazy" alt="${esc(g.title)} — নিজস্ব সম্পাদকীয় চিত্র"><span>${esc(g.title)} ↗</span></button>`}
function gallery(){return `<section class="pagehead"><div class="wrap"><div class="eyebrow"><i class="dot"></i> VISUAL CULTURE GALLERY</div><h1>রঙে রঙে বাংলাদেশ।</h1><p>রিকশা আর্ট, লোকশিল্প, আলপনা-প্রভাবিত নকশা এবং দেশি ডিজিটাল সংস্কৃতি থেকে অনুপ্রাণিত একটি ইন্টার‌্যাকটিভ গ্যালারি। ছবিগুলো এই সাইটের নিজস্ব SVG সম্পাদকীয় চিত্র—সংগৃহীত বাস্তব রিকশার ছবির বিকল্প নয়।</p></div></section><section class="wrap section"><div class="filters"><button class="active" data-gfilter="all" onclick="filterGallery('all',this)">সব নকশা</button><button data-gfilter="rickshaw" onclick="filterGallery('rickshaw',this)">রিকশা আর্ট</button><button data-gfilter="folk" onclick="filterGallery('folk',this)">লোকশিল্প</button><button data-gfilter="digital" onclick="filterGallery('digital',this)">ডিজিটাল সংস্কৃতি</button></div><div id="galleryGrid" class="gallerygrid">${galleryItems.map(galleryTile).join('')}</div></section><div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="ছবির বিস্তারিত" onclick="if(event.target===this)closeGallery()"><div class="lightboxinner"><div class="lightboxbar"><strong id="lightTitle"></strong><button class="btn" onclick="closeGallery()" aria-label="বন্ধ করুন">✕ বন্ধ</button></div><img id="lightImage" src="" alt=""><p id="lightCaption"></p><div class="lightboxbar"><button class="btn" onclick="moveGallery(-1)">← আগেরটি</button><span id="lightCount"></span><button class="btn" onclick="moveGallery(1)">পরেরটি →</button></div></div></div>`}
let galleryFilter='all',galleryIndex=0;function filterGallery(f,btn){galleryFilter=f;document.querySelectorAll('[data-gfilter]').forEach(b=>b.classList.toggle('active',b===btn));let items=galleryItems.map((g,i)=>({...g,index:i})).filter(g=>f==='all'||g.category===f);document.getElementById('galleryGrid').innerHTML=items.map(g=>galleryTile(g,g.index)).join('')}
function openGallery(i){galleryIndex=i;let g=galleryItems[i];document.getElementById('lightTitle').textContent=g.title;document.getElementById('lightImage').src=g.src;document.getElementById('lightImage').alt=g.title;document.getElementById('lightCaption').textContent=g.caption;document.getElementById('lightCount').textContent=(i+1)+' / '+galleryItems.length;document.getElementById('lightbox').classList.remove('hidden')}
function moveGallery(d){openGallery((galleryIndex+d+galleryItems.length)%galleryItems.length)}function closeGallery(){document.getElementById('lightbox')?.classList.add('hidden')}
function updateBanglaClock(){let now=new Date(),opts={timeZone:'Asia/Dhaka',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true};let time=new Intl.DateTimeFormat('bn-BD',opts).format(now);let date;try{date=new Intl.DateTimeFormat('bn-BD-u-ca-beng', {timeZone:'Asia/Dhaka',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now)}catch(e){date=new Intl.DateTimeFormat('bn-BD',{timeZone:'Asia/Dhaka',dateStyle:'full'}).format(now)};[['bnDate',date],['bdTime','বাংলাদেশ সময় '+time],['aboutBnDate',date],['aboutBdTime','বাংলাদেশ সময় '+time]].forEach(([id,v])=>{let el=document.getElementById(id);if(el)el.textContent=v})}
function render(){let h=location.hash||'#/',p=h.slice(1).split('?')[0]||'/',app=document.getElementById('app');document.getElementById('nav').classList.remove('open');if(p==='/')app.innerHTML=home();else if(p==='/archive'){app.innerHTML=archive();draw()}else if(p.startsWith('/story/'))app.innerHTML=detail(decodeURIComponent(p.slice(7)));else if(p==='/builder')app.innerHTML=builder();else if(p.startsWith('/edit/'))app.innerHTML=builder(decodeURIComponent(p.slice(6)));else if(p==='/about')app.innerHTML=about();else if(p==='/gallery')app.innerHTML=gallery();else app.innerHTML=home();window.scrollTo(0,0)}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
async function share(id){let s=stories.find(x=>x.id===id);try{if(navigator.share)await navigator.share({title:s.title,text:s.summary,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);toast('লিংক কপি হয়েছে।')}else prompt('লিংক কপি করুন',location.href)}catch(e){}}
function removeStory(id){if(confirm('এই গল্পটি এই ব্রাউজার থেকে মুছবেন?')){stories=stories.filter(x=>x.id!==id);save();location.hash='/archive';toast('গল্প মুছে ফেলা হয়েছে।')}}
document.addEventListener('input',e=>{if(e.target.id==='query')draw()});document.addEventListener('change',e=>{if(['catfilter','statusfilter'].includes(e.target.id))draw()});
document.addEventListener('submit',e=>{if(e.target.id!=='storyform')return;e.preventDefault();let f=new FormData(e.target),p=(location.hash.slice(1).split('?')[0]),edit=p.startsWith('/edit/')?decodeURIComponent(p.slice(6)):null,title=String(f.get('title')).trim(),summary=String(f.get('summary')).trim();let timeline=String(f.get('timeline')||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{let a=x.split('|').map(y=>y.trim());return [a[0]||'সময় অনির্দিষ্ট',a[1]||'ঘটনা',a.slice(2).join(' | ')||a[1]||x]});let sources=String(f.get('sources')||'').split('\n').map(x=>x.trim()).filter(x=>/^https?:\/\//i.test(x));let s={id:edit||'story-'+Date.now().toString(36),title,summary,category:String(f.get('category')),date:String(f.get('date')||''),status:String(f.get('status')),cover:String(f.get('cover')),timeline,sources};if(edit){let i=stories.findIndex(x=>x.id===edit);if(i>=0)stories[i]=s;else stories.push(s)}else stories.push(s);save();location.hash='/story/'+encodeURIComponent(s.id);toast('গল্প সেভ হয়েছে।')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGallery();if(!document.getElementById('lightbox')?.classList.contains('hidden')){if(e.key==='ArrowRight')moveGallery(1);if(e.key==='ArrowLeft')moveGallery(-1)}});updateBanglaClock();setInterval(updateBanglaClock,1000);document.getElementById('menu').onclick=()=>document.getElementById('nav').classList.toggle('open');window.addEventListener('hashchange',render);document.getElementById('year').textContent=new Date().getFullYear();render();
</script></body></html>
